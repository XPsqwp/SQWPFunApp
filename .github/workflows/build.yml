name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Scaffold android project
        run: |
          flutter create --platforms=android --org com.sqwpf --project-name sqwpfun _scaffold
          cp -r _scaffold/android .
          sed -i 's/android:label="sqwpfun"/android:label="SQWPFun"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
