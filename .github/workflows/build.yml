name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
      - name: Scaffold android project
        run: |
          flutter create --platforms=android --org com.sqwpf --project-name sqwpfun _scaffold
          cp -r _scaffold/android .
          sed -i 's/android:label="sqwpfun"/android:label="SQWPFun"/' android/app/src/main/AndroidManifest.xml
          # Flutter 模板只在 debug/profile 清单里放 INTERNET，release 必须自己加，
          # 否则所有 http 请求都会 _ClientSocketException
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|usesCleartext" android/app/src/main/AndroidManifest.xml
      - name: Copy SQWPFun launcher icons
        run: |
          for d in icons/mipmap-*; do
            cp -f "$d/ic_launcher.png" "android/app/src/main/res/$(basename $d)/ic_launcher.png"
            echo "icon -> $(basename $d)"
          done
      - run: flutter pub get
      - name: Patch inappwebview proguard rule (newer AGP rejects -dontoptimize)
        run: |
          for f in ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle; do
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
            echo "patched $f"
          done
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk
